name: Continuous Deployment

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  publish:
    name: Release ${{ matrix.target }}
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: macos-aarch64
            extension: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: macos-x86_64
            extension: ""
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: linux-x86_64
            extension: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x86_64
            extension: ".exe"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned toolchain and release target
        run: |
          rustup show active-toolchain
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package binary
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_ARTIFACT: ${{ matrix.artifact }}
          BINARY_EXTENSION: ${{ matrix.extension }}
        run: |
          mkdir -p dist
          cp "target/$RELEASE_TARGET/release/spt$BINARY_EXTENSION" dist/
          cp LICENSE dist/
          cd dist
          archive="spotify-tui-$RELEASE_ARTIFACT.tar.gz"
          tar czf "$archive" "spt$BINARY_EXTENSION" LICENSE
          if command -v sha256sum >/dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.sha256

  publish-cargo:
    name: Publish crate when configured
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_API_KEY }}
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: cargo publish --locked
